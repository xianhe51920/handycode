<head>

<style>
*{box-sizing:border-box}body{margin:0;padding:12px 10px 88px;background:#f5f6f8;color:#242b37;font:14px/1.5 system-ui,sans-serif;transition:background-color .2s,color .2s}
.hc-card{margin-bottom:14px;border:1px solid #e9ecf0;border-radius:16px;background:#fff;transition:background-color .2s,border-color .2s}
.hc-heading{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 14px;border-bottom:1px solid #f0f2f5}
.hc-heading h2{margin:0;font-size:16px;font-weight:650}.hc-actions{display:flex;gap:12px;flex-shrink:0}
.hc-actions button,.hc-actions a{padding:5px 0;color:#d4542d;background:none;border:0;font:inherit;font-size:12px;text-decoration:none}
.hc-actions button:disabled{color:#8a929f}
.hc-content{padding:10px;overflow:visible;min-width:0}.hc-loading{padding:28px 8px;color:#89919d;text-align:center;font-size:12px}
.hc-content > .hc-section-enter{animation:hc-section-reveal .22s ease-out both}
.hc-section-placeholder{height:100%;min-height:140px;display:flex;flex-direction:column;align-items:center;justify-content:space-around;gap:16px;padding:14px 8px;overflow:hidden}
.hc-section-placeholder i{display:block;position:relative;flex-shrink:0;width:68%;height:14px;border-radius:7px;background:#edf0f4;overflow:hidden}
.hc-section-placeholder i:nth-child(2){width:100%;height:72px}
.hc-section-placeholder i::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.7),transparent);transform:translateX(-100%);animation:hc-section-shimmer 1.4s linear infinite;will-change:transform}
.hc-section-placeholder[data-part="parcels"] i:nth-child(2){width:50%;height:44px}
html[data-hc-theme="dark"] body{background:#0f1218;color:#e6eaf2}
html[data-hc-theme="dark"] .hc-card{background:#181c24;border-color:#262c36}
html[data-hc-theme="dark"] .hc-heading{border-bottom-color:#232833;color:#e6eaf2}
html[data-hc-theme="dark"] .hc-actions button,html[data-hc-theme="dark"] .hc-actions a{color:#ff855e}
html[data-hc-theme="dark"] .hc-actions button:disabled{color:#636c7e}
html[data-hc-theme="dark"] .hc-loading{color:#8e98aa}
html[data-hc-theme="dark"] img[class*="width-origin--"],html[data-hc-theme="dark"] img[class*="width-rotate--"]{background:#fff!important;padding:8px 10px!important;border-radius:10px!important}
html[data-hc-theme="dark"] .hc-section-placeholder i{background:#232936}
html[data-hc-theme="dark"] .hc-section-placeholder i::after{background:linear-gradient(90deg,transparent,rgba(255,255,255,.15),transparent)}
@media(prefers-color-scheme:dark){
html:not([data-hc-theme="light"]) body{background:#0f1218;color:#e6eaf2}
html:not([data-hc-theme="light"]) .hc-card{background:#181c24;border-color:#262c36}
html:not([data-hc-theme="light"]) .hc-heading{border-bottom-color:#232833;color:#e6eaf2}
html:not([data-hc-theme="light"]) .hc-actions button,html:not([data-hc-theme="light"]) .hc-actions a{color:#ff855e}
html:not([data-hc-theme="light"]) .hc-actions button:disabled{color:#636c7e}
html:not([data-hc-theme="light"]) .hc-loading{color:#8e98aa}
html:not([data-hc-theme="light"]) .hc-section-placeholder i{background:#232936}
html:not([data-hc-theme="light"]) .hc-section-placeholder i::after{background:linear-gradient(90deg,transparent,rgba(255,255,255,.15),transparent)}
}
@keyframes hc-section-shimmer{to{transform:translateX(100%)}}
@keyframes hc-section-reveal{from{opacity:0}to{opacity:1}}
@media(prefers-reduced-motion:reduce){.hc-section-placeholder i::after,.hc-content > .hc-section-enter{animation:none}}
/* Only extracted DOM is visible. Source documents never receive touches. */
.hc-card:nth-of-type(2){display:none!important}
.hc-source{position:fixed;left:-100000px;top:0;width:calc(100vw - 42px);height:1000px;border:0;pointer-events:none}
</style>

<body id="handycode-merged">
<section class="hc-card">
<div class="hc-heading"><h2>身份码</h2><div class="hc-actions"><button data-refresh="identity" type="button">刷新</button></div></div>

<iframe class="hc-source" id="parcels-source" src="@@PARCELS_URL@@" title="包裹列表数据来源" aria-hidden="true" tabindex="-1" sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-popups-to-escape-sandbox"></iframe>

<script>
(function(){
'use strict';
var sources={},links=new WeakMap(),savedStyles=new WeakMap(),touching=false,lastTouch=0,darkOverride=null;
function isDark(){
 if(darkOverride!==null)return darkOverride;
 if(document.documentElement&&document.documentElement.getAttribute('data-hc-theme')==='dark')return true;
 if(document.documentElement&&document.documentElement.getAttribute('data-hc-theme')==='light')return false;
 return !!(window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches);
}
function parseRgb(val){
 var m=val&&val.match(/rgba?\(\s*(\d+)\s*,\s*(\d+)\s*,\s*(\d+)/i);
 return m?[+m[1],+m[2],+m[3]]:null;
}
function adaptTree(root,dark){
 if(!root)return;
 var walker=document.createTreeWalker(root,1),node=root;
 while(node){
  var rec=savedStyles.get(node);
  if(!rec){
   rec={color:node.style.getPropertyValue('color'),bg:node.style.getPropertyValue('background-color'),pad:node.style.getPropertyValue('padding'),rad:node.style.getPropertyValue('border-radius')};
   savedStyles.set(node,rec);
  }
  if(dark){
   var orig=links.get(node);
   if(node.tagName==='IMG'&&orig&&/width-origin--|width-rotate--/.test(orig.className||'')){
    node.style.setProperty('background-color','#ffffff','important');
    node.style.setProperty('padding','6px 10px','important');
    node.style.setProperty('border-radius','10px','important');
   }else{
    var bg=parseRgb(rec.bg);
    if(bg&&bg[0]>225&&bg[1]>225&&bg[2]>225)node.style.setProperty('background-color','transparent','important');
    var fg=parseRgb(rec.color);
    if(fg){
     if(fg[0]<105&&fg[1]<105&&fg[2]<120)node.style.setProperty('color','#e6eaf2','important');
     else if(fg[0]<165&&fg[1]<165&&fg[2]<175)node.style.setProperty('color','#9aa4b5','important');
    }
   }
  }else{
   if(rec.color)node.style.setProperty('color',rec.color,'important');else node.style.removeProperty('color');
   if(rec.bg)node.style.setProperty('background-color',rec.bg,'important');else node.style.removeProperty('background-color');
   if(rec.pad)node.style.setProperty('padding',rec.pad,'important');else node.style.removeProperty('padding');
   if(rec.rad)node.style.setProperty('border-radius',rec.rad,'important');else node.style.removeProperty('border-radius');
  }
  node=walker.nextNode();
 }
}
window.HandyCodeSetDark=function(dark){
 darkOverride=!!dark;
 if(document.documentElement)document.documentElement.setAttribute('data-hc-theme',darkOverride?'dark':'light');
 Object.keys(sources).forEach(function(k){
  var m=sources[k].mount;
  if(m&&m.firstElementChild)adaptTree(m.firstElementChild,darkOverride);
 });
 return darkOverride;
};
function showSectionLoading(state){
 state.refreshPresentation=true;
 var height=state.mount.getBoundingClientRect().height;
 if(!state.mount.dataset.ready)height=Math.max(height,state.type==='identity'?220:160);
 if(height>0)state.mount.style.height=height+'px';
 state.mount.setAttribute('aria-busy','true');
 delete state.mount.dataset.ready;
 var placeholder=document.createElement('div');
 placeholder.className='hc-section-placeholder';placeholder.dataset.part=state.type;
 placeholder.setAttribute('aria-label',state.type==='identity'?'正在刷新身份码':'正在刷新待取包裹');
 placeholder.innerHTML='<i></i><i></i><i></i>';
 state.mount.replaceChildren(placeholder);
}
function presentSection(state,fresh){
 var before=state.mount.getBoundingClientRect().height;
 state.mount.style.height='';
 if(state.refreshPresentation)fresh.classList.add('hc-section-enter');
 if(isDark())adaptTree(fresh,true);
 state.mount.replaceChildren(fresh);state.mount.dataset.ready='true';
 state.refreshPresentation=false;
 var after=state.mount.getBoundingClientRect().height;
 if(before>0&&Math.abs(after-before)>1&&state.mount.animate&&!window.matchMedia('(prefers-reduced-motion: reduce)').matches){
  state.mount.animate([{height:before+'px'},{height:after+'px'}],{duration:240,easing:'cubic-bezier(.2,.7,.2,1)'});
 }
}
document.addEventListener('touchstart',function(){touching=true},{passive:true});
function endTouch(){touching=false;lastTouch=Date.now()}
document.addEventListener('touchend',endTouch,{passive:true});
document.addEventListener('touchcancel',endTouch,{passive:true});
var props=['display','box-sizing','color','background-color','background-image','background-size','background-position','background-repeat','font-family','font-size','font-weight','font-style','line-height','letter-spacing','text-align','text-decoration','white-space','word-break','padding-top','padding-right','padding-bottom','padding-left','margin-top','margin-right','margin-bottom','margin-left','border-top','border-right','border-bottom','border-left','border-radius','box-shadow','opacity','vertical-align','align-items','align-self','justify-content','flex-direction','flex-wrap','flex-grow','flex-shrink','flex-basis','gap','grid-template-columns','grid-template-rows','object-fit','overflow-wrap','width','height','min-width','min-height','max-width','max-height','position','top','right','bottom','left','transform'];

function clone(source,doc,budget,skip){
 if(--budget.count<0)throw new Error('too-large');
 if(source===skip||typeof skip==='function'&&skip(source))return null;
 if(source.nodeType===3)return document.createTextNode(source.nodeValue);
 if(source.nodeType!==1||/^(SCRIPT|STYLE|LINK|IFRAME|OBJECT|EMBED|FORM|INPUT|TEXTAREA|SELECT|NOSCRIPT)$/.test(source.tagName))return null;
 var css=doc.defaultView.getComputedStyle(source);
 if(css.display==='none'||css.visibility==='hidden')return null;
 var copy;
 if(source.tagName==='CANVAS'){
  copy=document.createElement('img');
  try{copy.src=source.toDataURL()}catch(e){return null}
 }else{
  copy=source.cloneNode(false);
  Array.from(copy.attributes).forEach(function(a){if(/^(on|data-)/i.test(a.name)||/^(srcdoc|formaction)$/i.test(a.name))copy.removeAttribute(a.name)});
  if(copy.namespaceURI!=='http://www.w3.org/2000/svg'){copy.removeAttribute('id');copy.removeAttribute('class')}
  if(copy.tagName==='IMG'&&source.currentSrc)copy.src=source.currentSrc;
  if(copy.tagName==='A'){copy.removeAttribute('href');copy.removeAttribute('target')}
  Array.from(source.childNodes).forEach(function(child){var result=clone(child,doc,budget,skip);if(result)copy.appendChild(result)});
 }
 props.forEach(function(name){copy.style.setProperty(name,css.getPropertyValue(name),'important')});
 copy.style.setProperty('box-sizing','border-box','important');
 copy.style.setProperty('max-width','100%','important');
 // Strip every inner scrolling surface from the projected DOM.
 copy.style.setProperty('overflow','visible','important');
 copy.style.setProperty('touch-action','pan-y','important');
 if(/^(fixed|sticky)$/.test(css.position)||/auto|scroll/.test(css.overflowY)){
  copy.style.setProperty('position','static','important');
  copy.style.setProperty('height','auto','important');
  copy.style.setProperty('max-height','none','important');
  copy.style.setProperty('transform','none','important');
 }
 links.set(copy,source);
 return copy;
}
function textElement(doc,label){
 var walker=doc.createTreeWalker(doc.body,4),node;
 while((node=walker.nextNode())){
  var v=node.nodeValue.trim();
  if(v===label||(label==='待取件'&&/^待取件(\s*\(\d+\)|\s+\d+)?$/.test(v))){
   var p=node.parentElement;
   if(p&&p.closest&&p.closest('#fcc-snapshot-placeholder'))continue;
   return p;
  }
 }
 return null;
}
function select(doc,type){
 if(type==='identity')return doc.querySelector('[class*="wraper--q4Mag5Cd"]')||doc.querySelector('[class*="identity--"]');
 var tab=textElement(doc,'待取件');
 if(!tab)return null;
 var candidate=tab.parentElement;
 while(candidate&&candidate!==doc.body){
  var text=candidate.textContent||'';
  if(text.includes('追踪中')&&text.includes('已签收')&&candidate.getBoundingClientRect().height>110)return candidate;
  candidate=candidate.parentElement;
 }
 return null;
}
function statusTabs(doc){
 var candidate=textElement(doc,'待取件');
 while(candidate&&candidate!==doc.body){
  var text=candidate.textContent||'';
  if(text.length<80&&text.includes('追踪中')&&text.includes('已签收')&&text.includes('已退回'))return candidate;
  candidate=candidate.parentElement;
 }
 return null;
}
function rebindProjection(visible,fresh){
 if(!visible||!fresh)return;
 var original=links.get(fresh);
 if(original)links.set(visible,original);
 for(var i=0;i<visible.children.length;i++)rebindProjection(visible.children[i],fresh.children[i]);
}
function project(state){
 if(touching||Date.now()-lastTouch<800){queue(state);return}
 if(state.type==='identity'&&state.seeded){state.controller.finish();return}
 try{
  var doc=state.frame.contentDocument;
  if(!doc||!doc.body)return;
  // A refresh can leave the previous document accessible until navigation starts.
  if(doc===state.staleDocument)return;
  bindDocument(state,doc);
  if(state.type==='identity'){
   var barcode=doc.querySelector('img[class*="width-origin--"],img[class*="width-rotate--"]');
   if(!barcode||!barcode.complete||barcode.naturalWidth===0){HandyCodeOfficialIdentity.recover(doc,Date.now());return;}
  }
  if(state.type==='parcels'){
   var ice=doc.getElementById('ice-container');
   if(doc.getElementById('fcc-snapshot-placeholder')&&ice&&!ice.children.length)return;
   if(!state.pendingSelected){
    var pending=textElement(doc,'待取件');
    if(pending){
     state.pendingSelected=true;
     var cls=(pending.className||'')+' '+((pending.parentElement&&pending.parentElement.className)||'');
     if(!/active/i.test(cls)){pending.click();queue(state);return}
    }
   }
   if(/(^|\.)taobao\.com/i.test(doc.URL||'')){
    var host=ice||doc.body;
    var hasCards=!!host.querySelector('[id^="package-"],[class*="smartPackageList"],[data-role="group-list"],[data-role="station"],[class*="mainLine--"],[class*="empty--"],[class*="no-package"]');
    var bodyText=(host.innerText||host.textContent||'').replace(/\s+/g,' ');
    var hasText=/未查到.*包裹|暂无待取|暂无包裹|没有包裹|空空如也|还没有包裹|无待取|暂时没有|取件码|提货码/.test(bodyText);
    if(!hasCards&&!hasText)return;
    var sig=String(bodyText.length)+':'+host.querySelectorAll('[id^="package-"]').length;
    var firstReady=!state.mount.dataset.ready;
    state.mount.dataset.ready='true';
    state.mount.setAttribute('aria-busy','false');
    state.controller.finish();
    if(firstReady||state.signature!==sig){
     state.signature=sig;
     try{console.info('__HANDYCODE_PHASE__:parcels');}catch(ignore){}
    }
    return;
   }
  }
  var root=select(doc,state.type);
  if(!root)return;
  var signature=root.outerHTML;
  if(signature===state.signature&&state.mount.dataset.ready){state.controller.finish();return}
  var tabs=state.type==='parcels'?statusTabs(doc):null;
  var skip=state.type==='parcels'?function(node){
   return node===tabs||node.nodeType===1&&(node.textContent||'').replace(/\s/g,'')==='添加包裹';
  }:null;
  var fresh=clone(root,doc,{count:6000},skip);
  if(!fresh)return;
  if(state.type==='parcels'&&!fresh.textContent.replace(/\s/g,'').replace(/加载中[.。…]*/g,''))return;
  [['position','static'],['width','100%'],['height','auto'],['min-height','0'],['max-height','none'],['margin','0'],['transform','none']].forEach(function(p){fresh.style.setProperty(p[0],p[1],'important')});
  if(state.type==='identity'){
   [['display','flex'],['flex-direction','column'],['align-items','center'],['justify-content','center'],['text-align','center'],['padding','16px 8px'],['gap','12px']].forEach(function(p){fresh.style.setProperty(p[0],p[1],'important')});
   Array.from(fresh.children).forEach(function(child){
    [['position','static'],['transform','none'],['left','auto'],['right','auto'],['margin','0'],['text-align','center'],['align-self','center']].forEach(function(p){child.style.setProperty(p[0],p[1],'important')});
    if(child.tagName!=='IMG'&&child.tagName!=='CANVAS'){
     [['width','100%'],['height','auto'],['min-height','0'],['padding','0']].forEach(function(p){child.style.setProperty(p[0],p[1],'important')});
     var original=links.get(child);
     if(original&&/have-authenticated/.test(original.className||'')){
      [['display','inline-flex'],['width','auto'],['align-items','center'],['justify-content','center']].forEach(function(p){child.style.setProperty(p[0],p[1],'important')});
     }
    }
   });
   Array.from(fresh.querySelectorAll('img')).forEach(function(image){
    var original=links.get(image);
    if(original&&/width-origin--|width-rotate--/.test(original.className||'')){
     image.className='width-origin--';
     [['display','block'],['width','100%'],['height','82px'],['object-fit','fill'],['transform','none'],['margin','8px 0']].forEach(function(p){image.style.setProperty(p[0],p[1],'important')});
    }
   });
  }
  var visibleSignature=fresh.outerHTML;
  if(state.mount.dataset.ready&&state.visibleSignature===visibleSignature&&state.mount.firstElementChild){
   // Source-only changes (removed tabs, exposure metadata or image load
   // events) must not restart a fade or replace an identical image. Rebind
   // live official handlers if React replaced the original source nodes.
   rebindProjection(state.mount.firstElementChild,fresh);
  }else presentSection(state,fresh);
  state.visibleSignature=visibleSignature;
  state.signature=signature;
  state.controller.finish();
  if(state.type==='parcels'){try{console.info('__HANDYCODE_PHASE__:parcels');}catch(ignore){}}
 }catch(error){
  if(!state.mount.dataset.ready)state.mount.innerHTML='<div class="hc-loading">暂时无法整理官方内容，请刷新重试。</div>';
 }
}
function queue(state){state.controller.queue()}
function bindDocument(state,doc){
 if(doc===state.boundDocument)return;
 if(state.observer)state.observer.disconnect();

['identity','parcels'].forEach(function(type){
 var state=sources[type]={type:type,frame:document.getElementById(type+'-source'),mount:document.getElementById(type+'-content')};

  project:function(){project(state)},
  settled:function(){try{var doc=state.frame.contentDocument;if(type==='identity'&&doc&&HandyCodeOfficialIdentity.refreshControl(doc))return false;return state.loaded&&(!doc||doc.readyState==='complete')}catch(error){return state.loaded}},
  reload:function(){
   try{state.staleDocument=state.frame.contentDocument}catch(error){state.staleDocument=null}
   state.seeded=false;state.loaded=false;state.pendingSelected=false;state.signature=null;
   state.frame.src=state.frame.getAttribute('data-url')||state.frame.getAttribute('src');
  },
  busy:function(busy){
   document.querySelectorAll('[data-refresh="'+type+'"]').forEach(function(button){button.disabled=busy;button.textContent=busy?'刷新中':'刷新'});
   if(busy)showSectionLoading(state);else state.mount.setAttribute('aria-busy','false');
  },
  timeout:function(){delete state.mount.dataset.ready;state.signature=null;state.mount.innerHTML='<div class="hc-loading">官方内容暂未更新成功，请稍后刷新。</div>'}
 });
 state.frame.addEventListener('load',function(){
  state.loaded=true;

  // They never begin a new user-visible refresh cycle. Initial setup and
  // explicit refresh/login completion own the loading state.
  queue(state);
 });

  var node=event.target,original;
  while(node&&node!==state.mount&&!(original=links.get(node)))node=node.parentNode;

  original.click();

});
document.querySelectorAll('[data-refresh]').forEach(function(button){
 button.addEventListener('click',function(){
  var state=sources[button.dataset.refresh];
  state.controller.refresh();
 });
});
window.HandyCodeRefresh=function(){Object.keys(sources).forEach(function(type){sources[type].controller.refresh()});return true};
window.HandyCodeRefreshParcels=function(){if(sources.parcels)sources.parcels.controller.refresh();return true};
window.HandyCodeSeedIdentity=function(seedHtml){
 if(!seedHtml||!sources.identity)return false;
 try{
  var state=sources.identity;
  var wrap=document.createElement('div');
  wrap.innerHTML=seedHtml;
  var fresh=wrap.firstElementChild;
  if(!fresh)return false;
  var origUrl=state.frame.getAttribute('src');
  if(origUrl&&origUrl!=='about:blank')state.frame.setAttribute('data-url',origUrl);
  state.seeded=true;
  try{state.frame.src='about:blank';}catch(ignore){}
  presentSection(state,fresh);
  state.visibleSignature=fresh.outerHTML;
  state.controller.finish();
  return true;
 }catch(ignore){
  return false;
 }
};
window.HandyCodeParcelsSnapshot=function(){
 try{if(sources.parcels)project(sources.parcels);}catch(ignore){}
 var mount=document.getElementById('parcels-content');
 var doc=null;
 try{doc=sources.parcels&&sources.parcels.frame&&sources.parcels.frame.contentDocument;}catch(ignore){}
 var host=doc&&(doc.getElementById('ice-container')||doc.body);
 var isReady=!!(mount&&mount.dataset.ready==='true');
 if(!isReady&&host&&host.querySelectorAll('[id^="package-"]').length>0)isReady=true;
 if(!isReady)return {ready:false,orders:[]};
 function findCode(s){
  var m=String(s||'').match(/(?:取件码|提货码|取货码|凭码|自提码|取件密码|钥匙码)[:：\s【\[（(]*([A-Za-z0-9-]{2,16})(?![A-Za-z0-9-])/);
  if(m)return m[1];
  var sh=String(s||'').match(/(?:^|[^\dA-Za-z-])([A-Za-z0-9]{1,4}-\d{1,3}-\d{2,6})(?![A-Za-z0-9-])/);
  if(sh&&!/^20\d\d-\d{1,2}-\d{1,2}$/.test(sh[1]))return sh[1];
  return '';
 }
 var rows=[],seen=Object.create(null);
 if(host){
  var stations=Array.from(host.querySelectorAll('[data-role="station"],[id^="packageTitle-anchor-"],[id^="cabinetTitle-anchor-"]'));
  var cards=host.querySelectorAll('[id^="package-"]');
  for(var k=0;k<cards.length&&rows.length<40;k++){
   var card=cards[k];
   if(card.closest&&card.closest('#fcc-snapshot-placeholder'))continue;
   var code='';
   var chars=card.querySelectorAll('[class*="CHARACTER--"]');
   for(var ci=0;ci<chars.length;ci++){
    var ct=(chars[ci].textContent||'').trim();
    if(ct&&/^[A-Za-z0-9-]{2,20}$/.test(ct)){code=ct;break;}
   }
   var mainEl=card.querySelector('[class*="mainLine--"]');
   var mainTxt=mainEl?Array.from(mainEl.querySelectorAll('[class*="mainLineText--"]')).map(function(n){return (n.textContent||'').trim();}).filter(Boolean).join(' '):'';
   if(!code&&mainTxt){
    code=findCode(mainTxt);
    if(!code){
     var tok=mainTxt.match(/(?:^|\s)([A-Za-z0-9]{1,5}(?:-[A-Za-z0-9]{1,6})+|\d{4,10}|[A-Za-z]\d{2,8})(?=\s|$)/);
     if(tok&&!/^20\d\d-\d{1,2}-\d{1,2}$/.test(tok[1]))code=tok[1];
    }
   }
   if(!code)code=findCode(card.innerText||card.textContent||'');
   if(!code||seen[code])continue;
   var stName='淘宝/菜鸟驿站';
   for(var si=stations.length-1;si>=0;si--){
    if(stations[si].compareDocumentPosition&&(stations[si].compareDocumentPosition(card)&4)){
     var nmEl=stations[si].querySelector('[class*="name--"]');
     var nmTxt=(nmEl?nmEl.textContent:stations[si].textContent||'').trim().split(/\n+/)[0].replace(/(查看地址|求助|联系)$/,'').trim();
     if(nmTxt)stName=nmTxt.slice(0,80);
     break;
    }
   }
   var subParts=Array.from(card.querySelectorAll('[class*="subLineText--"]')).map(function(n){return (n.textContent||'').trim();}).filter(Boolean);
   var botEl=card.querySelector('[class*="bottomLine--"]');
   var botTxt=botEl?(botEl.textContent||'').trim():'';
   var detailParts=[];
   if(mainTxt&&mainTxt!==code)detailParts.push(mainTxt);
   if(subParts.length)detailParts.push(subParts.join(' · '));
   if(botTxt)detailParts.push(botTxt);
   seen[code]=true;
   rows.push({id:'tb_'+code,name:stName,status:'待取件',detail:(detailParts.join(' · ')||stName).slice(0,300),code:code});
  }
 }
 var scanRoot=host||mount;
 var full=(scanRoot&&(scanRoot.innerText||scanRoot.textContent)||'').trim();
 if(!rows.length&&(!full||/未查到.*包裹|暂无包裹|没有包裹|暂无待取|空空如也|还没有包裹|无待取|暂时没有/.test(full)))return {ready:true,orders:[]};
 var nodes=scanRoot?scanRoot.querySelectorAll('div,li,section'):[];
 for(var i=0;i<nodes.length&&rows.length<40;i++){
  if(nodes[i].closest&&nodes[i].closest('#fcc-snapshot-placeholder'))continue;
  var t=(nodes[i].innerText||nodes[i].textContent||'').trim();
  if(!t||t.length>600||t.length<4)continue;
  var c=findCode(t);
  if(!c||seen[c])continue;
  var lines=t.split(/\n+/).map(function(l){return l.trim();}).filter(function(l){
   return l&&!/^(待取件|追踪中|已签收|已退回|刷新|身份码|查看详情|扫码取件)$/.test(l);
  });
  var station='淘宝/菜鸟驿站';
  for(var j=0;j<lines.length;j++){if(/驿站|快递柜|丰巢|代收|自提|服务站|快递/.test(lines[j])){station=lines[j].slice(0,80);break;}}
  seen[c]=true;
  rows.push({id:'tb_'+c,name:station,status:'待取件',detail:lines.join(' · ').slice(0,300),code:c});
 }
 return {ready:true,orders:rows};
};
document.addEventListener('visibilitychange',function(){if(!document.hidden)Object.keys(sources).forEach(function(type){queue(sources[type])})});
window.addEventListener('pagehide',function(){Object.keys(sources).forEach(function(type){sources[type].controller.dispose()})});
})();
</script>
</body>
