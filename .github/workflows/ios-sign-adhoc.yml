name: iOS Build & Dual Distribution (TrollStore + AltStore)

# ──────────────────────────────────────────────────────────────────────────────
# 双渠道免费分发流水线
#
# 产出两种 IPA：
#   1. HandyCode-x.x.x-trollstore.ipa  — ldid 假签名，TrollStore 专用，永久有效
#   2. HandyCode-x.x.x-altstore.ipa   — 真实开发者签名，AltStore/Sideloadly 用，7天自动续
#
# 触发时机：
#   - 每6天自动（提前1天续签，留余量）
#   - 手动 workflow_dispatch
#
# GitHub Secrets 配置（Settings → Secrets and variables → Actions）：
#   APPLE_ID              Apple ID 邮箱
#   APPLE_ID_PASSWORD     App 专用密码（appleid.apple.com 生成）
#   APPLE_TEAM_ID         Team ID（developer.apple.com 右上角，10位）
#   IOS_DEVICE_UDID       (可选) iPhone UDID，用于 Ad-Hoc 注册
# ──────────────────────────────────────────────────────────────────────────────

on:
  schedule:
    - cron: "0 2 */6 * *"
  workflow_dispatch:
    inputs:
      device_udid:
        description: "iPhone UDID（可选，覆盖 Secret）"
        required: false
        default: ""

env:
  APP_NAME: HandyCode
  BUNDLE_ID: com.fairycrane.handycode
  VERSION: "0.8.6"
  SCHEME: HandyCode

jobs:
  # ════════════════════════════════════════════════════════════════════════════
  # Job 1: TrollStore IPA — ldid 假签名，永久有效，不需要 Apple ID
  # ════════════════════════════════════════════════════════════════════════════
  build-trollstore:
    name: "Build TrollStore IPA (ldid, permanent)"
    runs-on: macos-15-intel
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen && cd ios && xcodegen generate

      - name: Install ldid
        run: |
          brew install ldid
          ldid 2>/dev/null || ldid --help || true
          which ldid

      - name: Build unsigned Release IPA
        run: |
          mkdir -p dist build/trollstore-derived
          cd ios
          xcodebuild build \
            -project HandyCode.xcodeproj \
            -scheme HandyCode \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath ../build/trollstore-derived \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" 2>&1 | tail -30

      - name: Sign with ldid (TrollStore-compatible fake signature)
        run: |
          APP_PATH="build/trollstore-derived/Build/Products/Release-iphoneos/HandyCode.app"

          # 写入必要的 entitlements（TrollStore 安装时会忽略，但 ldid 需要格式正确）
          cat > /tmp/entitlements.xml << 'XML'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>application-identifier</key>
            <string>com.fairycrane.handycode</string>
            <key>get-task-allow</key>
            <false/>
          </dict>
          </plist>
          XML

          # 对主二进制假签名
          BINARY="$APP_PATH/HandyCode"
          echo "→ ldid signing: $BINARY"
          ldid -S/tmp/entitlements.xml "$BINARY"

          # 对所有 framework/dylib 也做假签名
          find "$APP_PATH" -name "*.dylib" -o -name "*.framework" | while read f; do
            bin=$(find "$f" -type f -perm +111 | head -1)
            [ -n "$bin" ] && ldid -S "$bin" && echo "  signed: $bin"
          done

          # 打包 IPA
          mkdir -p dist/Payload
          cp -R "$APP_PATH" dist/Payload/
          cd dist
          zip -r "HandyCode-${{ env.VERSION }}-trollstore.ipa" Payload
          shasum -a 256 "HandyCode-${{ env.VERSION }}-trollstore.ipa" > "HandyCode-${{ env.VERSION }}-trollstore.ipa.sha256"
          cat "HandyCode-${{ env.VERSION }}-trollstore.ipa.sha256"
          rm -rf Payload

      - name: Upload TrollStore IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: trollstore-ipa
          path: |
            dist/HandyCode-${{ env.VERSION }}-trollstore.ipa
            dist/HandyCode-${{ env.VERSION }}-trollstore.ipa.sha256

  # ════════════════════════════════════════════════════════════════════════════
  # Job 0: Check optional AltStore signing secrets cleanly
  # ════════════════════════════════════════════════════════════════════════════
  check-secrets:
    name: "Check Signing Secrets"
    runs-on: ubuntu-latest
    outputs:
      has_altstore: ${{ steps.check.outputs.has_altstore }}
    steps:
      - id: check
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$APPLE_ID" ] && [ -n "$APPLE_ID_PASSWORD" ] && [ -n "$APPLE_TEAM_ID" ]; then
            echo "has_altstore=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_altstore=false" >> "$GITHUB_OUTPUT"
          fi

  # ════════════════════════════════════════════════════════════════════════════
  # Job 2: AltStore IPA — 真实 Apple ID 签名，7天自动续签（需配置 Secrets）
  # ════════════════════════════════════════════════════════════════════════════
  build-altstore:
    name: "Build AltStore IPA (real signature, 7-day auto-renew)"
    runs-on: macos-15-intel
    needs: check-secrets
    if: needs.check-secrets.outputs.has_altstore == 'true'
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen && cd ios && xcodegen generate

      - name: Install Fastlane
        run: gem install fastlane --no-document

      - name: Generate Fastfile
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          mkdir -p fastlane dist build/altstore-profiles
          cat > fastlane/Fastfile << 'FASTFILE'
          default_platform(:ios)
          platform :ios do
            lane :sign_altstore do
              udid = ENV["DEVICE_UDID"]
              if udid && !udid.empty?
                register_devices(
                  devices: { "HandyCode User" => udid },
                  team_id: ENV["APPLE_TEAM_ID"]
                )
              end
              get_provisioning_profile(
                app_identifier: ENV["BUNDLE_ID"],
                username: ENV["APPLE_ID"],
                team_id: ENV["APPLE_TEAM_ID"],
                development: true,
                skip_install: false,
                output_path: "./build/altstore-profiles"
              )
              build_app(
                scheme: "HandyCode",
                project: "ios/HandyCode.xcodeproj",
                configuration: "Release",
                export_method: "development",
                output_directory: "./dist",
                output_name: "HandyCode-#{ENV['VERSION']}-altstore.ipa",
                derived_data_path: "./build/altstore-derived",
                xcargs: "CODE_SIGN_STYLE=Automatic DEVELOPMENT_TEAM=#{ENV['APPLE_TEAM_ID']}",
                export_options: {
                  method: "development",
                  teamID: ENV["APPLE_TEAM_ID"]
                }
              )
            end
          end
          FASTFILE

          cat > fastlane/Appfile << APPFILE
          app_identifier("$BUNDLE_ID")
          apple_id("$APPLE_ID")
          team_id("$APPLE_TEAM_ID")
          APPFILE

      - name: Sign with Fastlane (real Apple ID)
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          DEVICE_UDID: ${{ inputs.device_udid || secrets.IOS_DEVICE_UDID }}
          FASTLANE_APPLE_APPLICATION_SPECIFIC_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          BUNDLE_ID: ${{ env.BUNDLE_ID }}
          VERSION: ${{ env.VERSION }}
          FASTLANE_OPT_OUT_USAGE: "YES"
          FASTLANE_SKIP_UPDATE_CHECK: "YES"
        run: |
          fastlane sign_altstore 2>&1 | tee build/fastlane.log
          shasum -a 256 "dist/HandyCode-${{ env.VERSION }}-altstore.ipa" > \
            "dist/HandyCode-${{ env.VERSION }}-altstore.ipa.sha256"

      - name: Generate OTA manifest for AltStore IPA
        env:
          REPO: ${{ github.repository }}
          VERSION: ${{ env.VERSION }}
        run: |
          IPA_URL="https://github.com/${REPO}/releases/download/ios-signed-latest/HandyCode-${VERSION}-altstore.ipa"
          cat > dist/manifest.plist << PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>items</key>
            <array>
              <dict>
                <key>assets</key>
                <array>
                  <dict>
                    <key>kind</key><string>software-package</string>
                    <key>url</key><string>${IPA_URL}</string>
                  </dict>
                </array>
                <key>metadata</key>
                <dict>
                  <key>bundle-identifier</key><string>com.fairycrane.handycode</string>
                  <key>bundle-version</key><string>${VERSION}</string>
                  <key>kind</key><string>software</string>
                  <key>title</key><string>HandyCode</string>
                </dict>
              </dict>
            </array>
          </dict>
          </plist>
          PLIST

          # sign-info（供落地页读取有效期）
          SIGNED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          cat > dist/sign-info.txt << INFO
          version=${VERSION}
          signed_at=${SIGNED_AT}
          altstore_sha256=$(shasum -a 256 dist/HandyCode-${VERSION}-altstore.ipa | cut -d' ' -f1)
          INFO
          cat dist/sign-info.txt

      - name: Upload AltStore IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: altstore-ipa
          path: |
            dist/HandyCode-${{ env.VERSION }}-altstore.ipa
            dist/HandyCode-${{ env.VERSION }}-altstore.ipa.sha256
            dist/manifest.plist
            dist/sign-info.txt

  # ════════════════════════════════════════════════════════════════════════════
  # Job 3: 合并发布到 GitHub Release
  # ════════════════════════════════════════════════════════════════════════════
  publish-release:
    name: "Publish to GitHub Release (ios-signed-latest)"
    runs-on: ubuntu-latest
    needs: [build-trollstore, build-altstore]
    if: always() && needs.build-trollstore.result == 'success'
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Download all IPA artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          path: release-assets

      - name: Collect release files
        run: |
          mkdir -p dist
          if [ -d release-assets ]; then
            find release-assets -type f -exec cp {} dist/ \; || true
          fi
          if [ ! -f dist/sign-info.txt ]; then
            cat > dist/sign-info.txt << INFO
          version=${{ env.VERSION }}
          signed_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          INFO
          fi
          ls -lh dist/

      - name: Publish to GitHub Release (rolling tag)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ios-signed-latest
          name: "HandyCode iOS ${{ env.VERSION }} — 全版本安装与无限续签指南"
          body_path: docs/releases/ios-guide.md
          fail_on_unmatched_files: false
          files: |
            dist/*
            tools/ota-install/index.html
            tools/ota-install/install.html
          make_latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
